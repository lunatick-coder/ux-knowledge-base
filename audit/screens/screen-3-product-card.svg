  <rect x="50" y="475" width="260" height="80" rx="4" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5"/>
  <rect x="50" y="565" width="135" height="24" rx="4" fill="#ef4444"/>
  <text x="117" y="581" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">#ERR-05 [CRITICAL]</text>
  
