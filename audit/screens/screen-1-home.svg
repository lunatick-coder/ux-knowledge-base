<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background:#f8fafc; font-family:'Segoe UI', system-ui, sans-serif;">
  <!-- Browser Chrome / Header Bar -->
